name: Tag
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # each version's tag goes on the commit that published it (the first one to carry that VERSION), never on a later
      # commit that only touches the showcase or the docs; a tag that points elsewhere is moved there
      - name: Tag every version on the commit that published it
        run: |
          git fetch --force --tags origin
          declare -A first
          for c in $(git rev-list --reverse HEAD -- VERSION); do
            v="v$(git show "$c:VERSION")"
            [ -n "${first[$v]}" ] || first[$v]=$c
          done
          moved=()
          for v in "${!first[@]}"; do
            if [ "$(git rev-parse -q --verify "refs/tags/$v^{commit}")" != "${first[$v]}" ]; then
              git tag -f "$v" "${first[$v]}" >/dev/null
              moved+=("refs/tags/$v")
            fi
          done
          if [ ${#moved[@]} -gt 0 ]; then
            git push -f origin "${moved[@]}"
          fi
          echo "${#first[@]} versions, ${#moved[@]} tags moved or added"
