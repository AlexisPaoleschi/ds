<!doctype html><html lang="fr" data-theme="atelier"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../dist/ds.css"><link rel="stylesheet" href="../dist/ds-tools.css">
<script src="../dist/ds.js" defer></script><script src="../dist/ds-icons.js" defer></script><script src="../dist/ds-tools.js" defer></script><script src="../dist/ds-photo.js" defer></script><script src="../dist/ds-site.js" defer></script>
<title>ds 3.0 : une seule façon d’appeler</title></head>
<body>
<header class="top"><button class="btn is-icon" id="reload" type="button"></button></header>
<div class="wrap">
  <div id="dp"></div><div id="cal"></div><div id="pick"></div><div id="period"></div><div id="rank"></div><div id="mini"></div><div id="verdict"></div>
  <div id="bars"></div><div id="donut"></div><div id="line"></div><div id="heat"></div><div id="spark"></div><div id="avatar"></div>
  <section class="card" id="fold"><h2 class="ct">Une carte</h2><p>Dedans</p></section>
  <footer id="status"></footer>
  <div id="jobs"></div>
  <ul class="rows" id="list"><li data-key="a"><span class="row-title">A</span></li><li data-key="b"><span class="row-title">B</span></li></ul>
  <div id="sel"><div data-key="1"><input type="checkbox" class="sel-box"></div><div data-key="2"><input type="checkbox" class="sel-box"></div></div>
  <table class="tbl" id="tbl"><thead><tr><th><button class="sort" data-sort="n">N</button></th></tr></thead><tbody><tr><td>2</td></tr><tr><td>1</td></tr></tbody></table>
  <div class="sheet" id="sheet" hidden><div class="sheet-panel"><button class="sheet-close" type="button">×</button></div></div>
  <div class="photogrid" id="grid"><a href="#"><img width="300" height="200" alt=""></a></div>
  <form id="nl"><input type="email" name="email"><button class="btn" type="submit">S’inscrire</button></form>
  <div class="side-layout" data-drawer="names-side"><div class="scrim"></div><aside class="side"></aside><div class="main"></div></div>
  <button class="edgetab" data-drawer-toggle="names-side" type="button"><span class="edgetab-label">Filtres</span></button>
</div>
<script>document.addEventListener("DOMContentLoaded", () => { window.ready = true; });</script>
</body></html>
