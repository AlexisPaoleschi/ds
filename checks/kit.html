<!doctype html>
<html lang="fr" data-theme="atelier">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ds · les petits outils</title>
<link rel="stylesheet" href="../dist/ds.css">
<link rel="stylesheet" href="../dist/ds-tools.css">
<script src="../dist/ds.js"></script>
<script src="../dist/ds-tools.js"></script>
</head>
<body>
<div class="boot" id="boot" role="status" aria-live="polite"><div><p class="boot-title">Chargement…</p><p class="boot-text"></p></div></div>
<p class="note">Une note.</p>
<p class="note is-faint">Une note discrète.</p>
<p><span id="up" class="tone is-good">+12</span> <span id="down" class="tone is-bad">−3</span></p>
<div id="delta"></div>
<div id="build"></div>
<div id="forms">
  <header class="page-head"><p class="eyebrow">Bonjour Léa</p><h1 class="title-1">Mes galeries</h1><a class="btn" href="#">Nouvelle</a></header>
  <p class="lede">Prenez votre temps.</p><h2 class="title-2">Section</h2><h3 class="title-3 is-caps">Bloc</h3>
  <div class="field-group"><label class="field-label" for="pw">Mot de passe</label><div class="field-row"><input id="pw" type="password" value="abc"><button class="btn" type="button" id="pw-t" data-str-show="Afficher" data-str-hide="Masquer">Afficher</button><button class="btn" type="button" id="pw-g">Générer</button></div></div>
  <div class="field-group"><textarea id="note">un</textarea><p class="field-note" id="note-n">Enregistré tout seul quand vous quittez le champ.</p></div>
  <fieldset class="checks"><legend class="field-label">Mails</legend><label class="check"><input type="checkbox"> Une galerie terminée</label></fieldset>
  <button class="btn" type="button" aria-pressed="true" id="pressed">Grille</button>
  <nav class="pager"><a class="btn" href="#">Plus anciennes</a></nav>
  <details class="fold is-lead" open><summary>Photos</summary><p>…</p></details>
  <h4 class="sect">Budget<span class="sect-sum">Prévu <b>1 234€</b></span></h4>
  <table class="tbl"><tbody id="tb"><tr class="tbl-group"><td colspan="2"><span class="tbl-group-head"><span>Hier</span><span class="tbl-group-sum">−12€</span></span></td></tr>
    <tr class="is-link" tabindex="0" data-k="a"><td>Boulangerie</td><td><button type="button">Catégorie</button></td></tr></tbody></table>
  <div id="settings-demo"></div>
</div>
<div class="stats"><div class="stat"><span class="stat-value">40</span><span class="stat-label">Photos</span></div><div class="stat is-accent"><span class="stat-value" id="acc">9</span><span class="stat-label">Choisies</span></div></div>
<script>window.ready = true;</script>
</body>
</html>
